<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员登录 · 栖桉集后台</title>
  <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body class="admin-login-body">
  <div class="admin-login-card">
    <div class="title">✿ 栖桉集</div>
    <div class="sub">管 理 后 台</div>
    <form id="loginForm">
      <label>管理员账号
        <input id="username" type="text" required placeholder="请输入管理员账号" autocomplete="username" maxlength="20">
      </label>
      <label>密码
        <input id="password" type="password" required placeholder="请输入密码" autocomplete="current-password" maxlength="30">
      </label>
      <button class="btn" type="submit">登 录</button>
    </form>
  </div>

  <script src="/admin/js/admin-common.js"></script>
  <script src="/admin/js/login.js"></script>
</body>
</html>
