<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户管理 · 栖桉集后台</title>
  <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body class="admin-body">
  <aside class="sb" id="sidebar"></aside>

  <div class="main">
    <header class="topbar">
      <span class="tb-title" id="topTitle">用户管理</span>
      <span class="tb-right">
        <span id="topUser"></span>
        <a href="javascript:adminLogout()">退出登录</a>
        <a class="danger" href="javascript:adminDeleteAccount()">注销账号</a>
      </span>
    </header>

    <main class="content">
      <div class="toolbar-row">
        <div class="search-box">
          <input id="keyword" type="text" placeholder="按用户名 / 昵称搜索…" maxlength="30">
          <button class="btn" id="searchBtn">搜索</button>
        </div>
      </div>

      <table class="table">
        <thead>
          <tr>
            <th>用户</th>
            <th>城市</th>
            <th>注册时间</th>
            <th>状态</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>

      <div id="pagination" class="pagination"></div>
    </main>
  </div>

  <script src="/admin/js/admin-common.js"></script>
  <script src="/admin/js/users.js"></script>
</body>
</html>
