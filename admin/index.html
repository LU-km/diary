<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>仪表盘 · 栖桉集后台</title>
  <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body class="admin-body">
  <!-- 左侧导航栏 -->
  <aside class="sb" id="sidebar"></aside>

  <div class="main">
    <!-- 顶栏 -->
    <header class="topbar">
      <span class="tb-title" id="topTitle">仪表盘</span>
      <span class="tb-right">
        <span id="topUser"></span>
        <a href="javascript:adminLogout()">退出登录</a>
        <a class="danger" href="javascript:adminDeleteAccount()">注销账号</a>
      </span>
    </header>

    <main class="content">
      <!-- 统计卡片 -->
      <div class="stat-grid" id="stats"></div>

      <!-- 最近动态 -->
      <div class="two-col">
        <div class="card">
          <h3>最近注册</h3>
          <ul class="mini-list" id="recentUsers"></ul>
        </div>
        <div class="card">
          <h3>最新日记</h3>
          <ul class="mini-list" id="recentDiaries"></ul>
        </div>
      </div>

      <!-- 修改密码 -->
      <div class="card" style="margin-top:18px;max-width:520px">
        <h3>修改密码</h3>
        <form id="passwordForm">
          <div class="form-row">
            <label>当前密码
              <input id="oldPassword" type="password" required autocomplete="current-password">
            </label>
          </div>
          <div class="form-row">
            <label>新密码
              <input id="newPassword" type="password" required autocomplete="new-password" placeholder="至少 8 位（管理员不限字符集）">
            </label>
          </div>
          <div class="form-row">
            <label>确认新密码
              <input id="confirmPassword" type="password" required autocomplete="new-password">
            </label>
          </div>
          <p class="hint">修改成功后所有会话将失效，需要重新登录。</p>
          <button class="btn" type="submit">修改密码</button>
        </form>
      </div>
    </main>
  </div>

  <script src="/admin/js/admin-common.js"></script>
  <script src="/admin/js/index.js"></script>
</body>
</html>
