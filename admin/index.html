<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>仪表盘 · 栖桉集后台</title>
  <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body class="admin-body">
  <!-- 左侧导航栏 -->
  <aside class="sb" id="sidebar"></aside>

  <div class="main">
    <!-- 顶栏 -->
    <header class="topbar">
      <span class="tb-title" id="topTitle">仪表盘</span>
      <span class="tb-right">
        <span id="topUser"></span>
        <a href="javascript:adminLogout()">退出登录</a>
        <a class="danger" href="javascript:adminDeleteAccount()">注销账号</a>
      </span>
    </header>

    <main class="content">
      <!-- 统计卡片 -->
      <div class="stat-grid" id="stats"></div>

      <!-- 最近动态 -->
      <div class="two-col">
        <div class="card">
          <h3>最近注册</h3>
          <ul class="mini-list" id="recentUsers"></ul>
        </div>
        <div class="card">
          <h3>最新日记</h3>
          <ul class="mini-list" id="recentDiaries"></ul>
        </div>
      </div>

      <!-- 修改密码 -->
      <div class="card" style="margin-top:18px;max-width:520px">
        <h3>修改密码</h3>
        <form id="passwordForm">
          <div class="form-row">
            <label>当前密码
              <input id="oldPassword" type="password" required autocomplete="current-password">
            </label>
          </div>
          <div class="form-row">
            <label>新密码
              <input id="newPassword" type="password" required autocomplete="new-password" placeholder="至少 8 位（管理员不限字符集）">
            </label>
          </div>
          <div class="form-row">
            <label>确认新密码
              <input id="confirmPassword" type="password" required autocomplete="new-password">
            </label>
          </div>
          <p class="hint">修改成功后所有会话将失效，需要重新登录。</p>
          <button class="btn" type="submit">修改密码</button>
        </form>
      </div>

      <!-- 全站广播（v1.2.0） -->
      <div class="card" style="margin-top:18px;max-width:520px">
        <h3>全站广播</h3>
        <p class="hint">广播将作为通知发送给所有用户（在各自的「消息中心」可见）。</p>
        <form id="broadcastForm">
          <div class="form-row">
            <textarea id="broadcastContent" maxlength="500" rows="3" placeholder="输入要广播的内容…" style="width:100%;padding:10px;border:1px solid var(--line,#e6e2da);border-radius:8px;font-size:14px;font-family:inherit"></textarea>
          </div>
          <button class="btn" type="submit">发送广播</button>
        </form>
      </div>

      <!-- 违禁词库（v1.2.1） -->
      <div class="card" style="margin-top:18px;max-width:520px">
        <h3>违禁词库</h3>
        <p class="hint">命中违禁词的内容会被自动拦截（发布日记 / 评论 / 私信 / 广播）；同一用户 3 天内累计 5 次违规将自动禁言 3 天。</p>
        <div class="word-list" id="wordList"><p class="hint">加载中…</p></div>
        <form id="wordForm" class="word-form">
          <input id="wordInput" type="text" maxlength="20" placeholder="输入要添加的违禁词…">
          <button class="btn btn-sm" type="submit">添加</button>
        </form>
      </div>

      <!-- 违规用户名单（v1.2.1） -->
      <div class="card" style="margin-top:18px;max-width:520px">
        <h3>违规用户</h3>
        <p class="hint">3 天内违规累计 5 次自动禁言 3 天（系统已发消息通知本人）。</p>
        <ul class="mini-list" id="violationList"><li class="hint">加载中…</li></ul>
      </div>
    </main>
  </div>

  <script src="/admin/js/admin-common.js"></script>
  <script src="/admin/js/index.js"></script>
</body>
</html>
