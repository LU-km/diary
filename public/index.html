<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>栖桉集 · 把心事写进文字里</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- 顶部导航（含全局搜索框） -->
  <header class="nav-wrap"><nav class="container nav" id="nav"></nav></header>

  <!-- 首屏横幅 -->
  <section class="hero">
    <p class="hero-kicker">A QUIET DIARY COMMUNITY</p>
    <h1 class="hero-title">栖桉集</h1>
    <p class="hero-sub">「把平凡的日子，安放在温柔的文字里」</p>
    <a class="btn btn-primary" href="/write.html">✎ 写一篇日记</a>
  </section>

  <!-- 日记广场 -->
  <main class="container">
    <div class="toolbar" id="toolbar">
      <h2 class="section-title" id="feedTitle">日记广场</h2>
      <div class="search-tabs" id="searchTabs" style="display:none">
        <button class="tab active" data-type="diary">日记</button>
        <button class="tab" data-type="user">用户</button>
      </div>
    </div>
    <div id="feed" class="feed"><p class="empty">加载中…</p></div>
    <div id="pagination" class="pagination"></div>
  </main>

  <footer class="footer">© 2026 栖桉集 · 愿你被世界温柔以待</footer>

  <script src="/js/common.js"></script>
  <script src="/js/index.js"></script>
</body>
</html>
