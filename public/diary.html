<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日记详情 · 栖桉集</title>
  <link rel="stylesheet" href="/css/style.css">
  <!-- 开源地图：Leaflet（本地托管，无需 CDN）+ OpenStreetMap（可商用，需署名） -->
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <script src="/vendor/leaflet/leaflet.js"></script>
</head>
<body>
  <header class="nav-wrap"><nav class="container nav" id="nav"></nav></header>

  <main class="container narrow">
    <div id="diaryBox" class="card diary-detail"><p class="empty">加载中…</p></div>

    <!-- 评论区 -->
    <div class="card comment-card" id="commentCard" style="display:none">
      <h3 class="sub-title" style="margin:0 0 12px">评论 <span id="commentCount" class="dim"></span></h3>
      <div id="commentList" class="comment-list"><p class="empty">还没有评论</p></div>
      <form id="commentForm" class="comment-form">
        <div class="reply-bar" id="replyBar" style="display:none">
          <span class="reply-hint" id="replyHint"></span>
          <button type="button" class="btn btn-ghost btn-sm" id="cancelReplyBtn" style="display:none">取消回复</button>
        </div>
        <textarea id="commentInput" maxlength="500" rows="2" placeholder="写下你的评论…（无需审核，即可显示）"></textarea>
        <button class="btn btn-primary btn-sm" type="submit">发表评论</button>
      </form>
      <p class="hint" id="commentLoginHint" style="display:none">请 <a href="/login.html">登录</a> 后发表评论</p>
    </div>
  </main>

  <footer class="footer">© 2026 栖桉集 · 愿你被世界温柔以待</footer>

  <script src="/js/common.js"></script>
  <script src="/js/diary.js"></script>
</body>
</html>
